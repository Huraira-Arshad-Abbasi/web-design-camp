<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <title>web design mastery | camp</title>
</head>

<body>
  <nav>
    <div class="lgo">Camp</div>
    <ul>
      <li>HOME</li>
      <li>ABOUT US</li>
      <li>CONTACT</li>
    </ul>
    <div class="btn">
      <button><i class="ri-search-line"></i></button>
      <button><i class="ri-shopping-bag-line"></i></button>
    </div>
  </nav>
  <div class="container">
    <div class="left">
      <h1 id="animation">Enjoy Your Holidays</h1>
      <div class="btn">
        <button>BOOK NOW</button>
      </div>
    </div>
    <div class="right">
      <div class="images">
        <img class="img1" width="50%" src="tent-1.jpg" alt="tent-1" class="tent-1" />
        <img class="img2" width="50%" src="tent-2.jpg" alt="tent-2" class="tent-2" />
      </div>
      <div class="content">
        <div class="textContent">
          <h4>12m2 | 2 beds</h4>
          <h2>BASIC TENT</h2>
          <h3>Your Camping Experience</h3>
          <p>
            Designed for those who appreciate the fundamental joys of camping,
            our selection of basic tents offers comfort and reliability without
            unnecessary frills.
          </p>
        </div>
      </div>
    </div>
  </div>
  <div class="container_2">
    <div class="location">
      <span><i class="ri-map-pin-2-fill"></i></span>
      OUR LOCATION
    </div>
    <div class="socials">
      <span>
        <a href="#"><i class="ri-facebook-fill"></i></a>
      </span>
      <span>
        <a href="#"><i class="ri-instagram-line"></i></a>
      </span>
      <span>
        <a href="#"><i class="ri-twitter-fill"></i></a>
      </span>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="script.js"></script>
</body>

</html>
